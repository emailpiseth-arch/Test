# Publishes the files on this branch as a GitHub Pages site (the staff demo of the building app).
# GitHub only lets the repository's default branch deploy to the github-pages environment, so the demo is published from there.
name: Publish demo
on:
  push:
    branches: [claude/build-flappy-bird-Xpuht, demo]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
